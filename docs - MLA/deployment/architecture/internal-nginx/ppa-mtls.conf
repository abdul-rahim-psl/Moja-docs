# Internal Nginx in front of PPA on 10.0.115.186.
# The ingress gateway forwards raw TCP (no TLS termination, no PROXY protocol), so cch-mla's TLS
# session ends here and PPA is reached over plain HTTP on the cch-ppa_default Docker network.

server_tokens off;

log_format ppa_ingress '$remote_addr [$time_iso8601] "$request_method $request_uri" $status '
                       'upstream=$upstream_status rt=$request_time urt=$upstream_response_time '
                       'tls=$ssl_protocol';

# Re-resolve PPA through Docker's DNS: a recreated PPA container gets a new IP, and a name resolved
# only at startup keeps proxying to the old one (502 until reload), or stops Nginx starting at all.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;                     # the 30 s default left 20 s of 502s after PPA came back

upstream ppa {
    zone ppa_upstream 64k;               # required by `resolve`
    server ppa:3000 resolve;
    keepalive 16;                        # MLA reuses connections; so does this hop
}

server {
    listen 8443 ssl default_server;
    server_name mla-interconnect.paysyslabs.com;

    ssl_certificate      /etc/nginx/certs/mla-interconnect.crt;
    ssl_certificate_key  /etc/nginx/certs/mla-interconnect.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:ppa_tls:10m;

    # Client certificates are not requested yet: the COMESA/DRPP CA bundle has not arrived, and MLA
    # treats a 4xx as permanent, so a rejected client certificate would drop events, not delay them.

    access_log /dev/stdout ppa_ingress;  # never bodies: they carry PII
    client_max_body_size 2m;             # above PPA's own 1 MiB limit, so PPA alone decides

    proxy_http_version     1.1;
    proxy_set_header       Connection "";
    proxy_set_header       Host $host;
    proxy_set_header       X-Forwarded-For $remote_addr;
    proxy_set_header       X-Forwarded-Proto https;
    proxy_connect_timeout  1s;           # a dead PPA answers 5xx before MLA's own 2 s timeout fires
    proxy_read_timeout     10s;
    proxy_next_upstream    off;          # never re-send a POST to PPA on this hop's initiative
    proxy_intercept_errors off;          # PPA's own status reaches MLA unchanged

    # MLA's base URL ends in /others and PPA's routes sit at the root, so /others is stripped.
    # The bare form is accepted too, so a base URL without /others still routes.
    location ~ ^(?:/others)?/(?<ppa_route>QUOTES|FXQUOTES|TRANSFERS|FXTRANSFERS)$ {
        limit_except POST { deny all; }
        proxy_pass http://ppa/$ppa_route;
    }

    location ~ ^(?:/others)?/health/(?<ppa_health>live|ready)$ {
        limit_except GET { deny all; }
        proxy_pass http://ppa/health/$ppa_health;
    }

    # Any other path is a routing fault, not a client error: 503 makes MLA hold and retry the event,
    # where a 404 would make it skip the event for good.
    location / { return 503; }
}
